name: Trigger auto-fill run
description: Calls the auto-fill run endpoint with the secret header
inputs:
  api-url:
    description: Base SITE_URL (including scheme)
    required: true
  auto-fill-secret:
    description: Shared secret used to authorize the auto-fill run endpoint
    required: true
runs:
  using: composite
  steps:
    - shell: bash
      run: |
        API_URL="${{ inputs.api-url }}"
        AUTO_FILL_SECRET="${{ inputs.auto-fill-secret }}"

        if [ -z "$API_URL" ] || [ -z "$AUTO_FILL_SECRET" ]; then
          echo "SITE_URL or AUTO_FILL_SECRET not set; skipping auto-fill run";
          exit 0;
        fi

        curl -s -X POST "$API_URL/api/admin/homepage/auto-fill/run" -H "x-auto-fill-secret: $AUTO_FILL_SECRET" -H "Content-Type: application/json" -d '{}' -o /tmp/autofill.json && cat /tmp/autofill.json
